<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار تمرین (نسخه پایه)</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; color: #2c3e50;}
        .hidden { display: none !important; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #ecf0f1;}
        h2 { color: #2980b9; }
        button { background: #2980b9; color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; width: 100%; margin-bottom: 15px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button.legs { background: #f39c12; }
        button.cardio { background: #e74c3c; }
        button.alt { background: #95a5a6; padding: 15px; margin-top: 20px; }
        button.outline { background: transparent; color: #7f8c8d; border: 2px solid #bdc3c7; box-shadow: none; }
        .timer { font-size: 4rem; font-weight: bold; color: #27ae60; margin: 20px 0; font-family: monospace;}
        .instruction { font-size: 1.1rem; line-height: 1.6; padding: 10px; background: #f8f9fa; border-radius: 10px;}
    </style>
</head>
<body>

<div id="home-screen">
    <h2>دستیار تمرین ساسان</h2>
    <p>نسخه سبک و سریع</p>
    <div class="card">
        <button onclick="startWorkout('spine')">۱. روتین کمر و عضله‌سازی</button>
        <button class="legs" onclick="startWorkout('legs')">۲. تمرینات پا</button>
        <button class="cardio" onclick="startWorkout('cardio')">۳. تمرین کاردیو</button>
    </div>
</div>

<div id="workout-screen" class="hidden">
    <h3 id="ex-title" style="color: #2980b9; font-size: 1.4rem;">نام تمرین</h3>
    <div id="ex-desc" class="instruction">توضیحات تمرین در اینجا قرار می‌گیرد.</div>
    
    <div class="card" style="margin-top: 20px;">
        <h4 id="phase-title" style="font-size: 1.2rem; color: #7f8c8d;">آماده‌سازی</h4>
        <div id="timer-display" class="timer">5</div>
        <button id="btn-done" class="hidden" onclick="nextStep()" style="background: #27ae60;">انجام شد ✔️</button>
        <button id="btn-skip" class="outline" onclick="nextStep()">رد کردن ⏭️</button>
    </div>
    
    <button class="alt" onclick="goHome()">توقف و بازگشت 🏠</button>
</div>

<script>
    // حذف کامل امکانات پیچیده، فقط منطق ساده جاوااسکریپت
    const exercises = {
        spine: [
            { title: "چرخش لگن روی زمین", desc: "خوابیده به پشت، زانوها خم، چسباندن گودی کمر به زمین. (۱۲ تکرار)", type: "reps" },
            { title: "گربه-گاو آرام", desc: "چهار دست و پا. تمرکز روی مهره‌های کمر. (۱۵ تکرار)", type: "reps" },
            { title: "پلانک جانبی (چپ)", desc: "بدن در یک خط صاف روی آرنج چپ.", type: "time", time: 30 },
            { title: "پلانک جانبی (راست)", desc: "بدن در یک خط صاف روی آرنج راست.", type: "time", time: 30 }
        ],
        legs: [
            { title: "اسکات روی صندلی", desc: "نشستن کنترل‌شده روی لبه صندلی. (۱۵ تکرار)", type: "reps" },
            { title: "لانژ رو به جلو", desc: "زانوی عقب نزدیک زمین. (۱۰ تکرار)", type: "reps" }
        ],
        cardio: [
            { title: "درجا زدن ایستاده", desc: "سینه صاف، زانوها بالا.", type: "time", time: 40 },
            { title: "پروانه بدون پرش", desc: "سرعت بالا بدون پرش.", type: "time", time: 40 }
        ]
    };

    let currentList = [];
    let currentIndex = 0;
    let phase = 'prep'; 
    let timer = null;
    let timeLeft = 0;

    function startWorkout(type) {
        currentList = exercises[type];
        currentIndex = 0;
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('workout-screen').classList.remove('hidden');
        loadExercise();
    }

    function goHome() {
        clearInterval(timer);
        document.getElementById('workout-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
    }

    function loadExercise() {
        if (currentIndex >= currentList.length) {
            alert("🏆 عالی بود! تمرین تمام شد.");
            goHome();
            return;
        }
        let ex = currentList[currentIndex];
        document.getElementById('ex-title').innerText = ex.title;
        document.getElementById('ex-desc').innerText = ex.desc;
        startPhase('prep', 5);
    }

    function startPhase(newPhase, time) {
        clearInterval(timer);
        phase = newPhase;
        timeLeft = time;
        
        let phaseTitle = document.getElementById('phase-title');
        let display = document.getElementById('timer-display');
        let btnDone = document.getElementById('btn-done');
        let btnSkip = document.getElementById('btn-skip');

        display.innerText = timeLeft;

        if (phase === 'prep') {
            phaseTitle.innerText = "آماده‌سازی...";
            btnDone.classList.add('hidden');
            btnSkip.classList.remove('hidden');
            runClock();
        } else if (phase === 'work') {
            phaseTitle.innerText = "🔥 در حال اجرا";
            let ex = currentList[currentIndex];
            if (ex.type === 'reps') {
                display.innerText = "بدون تایمر";
                btnDone.classList.remove('hidden');
                btnSkip.classList.add('hidden');
            } else {
                btnDone.classList.add('hidden');
                btnSkip.classList.add('hidden');
                runClock();
            }
        } else if (phase === 'rest') {
            phaseTitle.innerText = "استراحت ☕";
            btnDone.classList.add('hidden');
            btnSkip.classList.remove('hidden');
            runClock();
        }
    }

    function runClock() {
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = timeLeft;
            if (timeLeft <= 0) nextStep();
        }, 1000);
    }

    function nextStep() {
        if (phase === 'prep') {
            let ex = currentList[currentIndex];
            startPhase('work', ex.time || 0);
        } else if (phase === 'work') {
            startPhase('rest', 20);
        } else if (phase === 'rest') {
            currentIndex++;
            loadExercise();
        }
    }
</script>
</body>
</html>
