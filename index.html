<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار تمرین ساسان</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #2c3e50; --text-sec: #7f8c8d;
            --primary: #2980b9; --primary-light: #d6eaf8; --success: #27ae60;
            --warning: #f39c12; --danger: #e74c3c; --border: #ecf0f1;
        }
        body.dark-mode {
            --bg-color: #121212; --card-bg: #1a1a1a; --text-main: #e0e0e0;
            --text-sec: #95a5a6; --primary: #3498db; --primary-light: #212f3d; --border: #2c2c2c;
        }
        body { font-family: Tahoma, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; text-align: center; transition: background 0.3s, color 0.3s; }
        .hidden { display: none !important; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid var(--border); }
        h2 { color: var(--primary); font-size: 1.4rem; margin: 10px 0; font-weight: bold; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); font-size: 1.1rem; padding: 8px 12px; border-radius: 10px; cursor: pointer; color: var(--text-main); }
        .version-tag { font-size: 0.9rem; font-weight: bold; color: white; padding: 5px 10px; border-radius: 8px; background: #8e44ad; }

        button { background: var(--primary); color: white; border: none; padding: 16px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; width: 100%; margin-bottom: 12px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        body.dark-mode button { background: #22303c; color: #ecf0f1; border: 1px solid #324454; }
        body.dark-mode button.legs { background: #3d2d14; border-color: #5c431d; color: #f39c12; }
        body.dark-mode button.cardio { background: #3d1a1a; border-color: #5c2626; color: #e74c3c; }
        body.dark-mode button.walk { background: #143d22; border-color: #1e5c33; color: #2ecc71; }
        
        button.legs { background: #f39c12; }
        button.cardio { background: #e74c3c; }
        button.walk { background: var(--card-bg); color: var(--success); border: 2px solid var(--success); }
        button.alt { background: var(--text-sec); padding: 12px; margin-top: 15px; }
        button.outline { background: transparent; color: var(--text-sec); border: 2px solid var(--border); box-shadow: none; }
        body.dark-mode button.outline { color: #a0a0a0; border-color: #444; }

        .week-grid { display: flex; justify-content: space-between; gap: 5px; margin-top: 10px; }
        .day-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
        .day-name { font-size: 0.8rem; color: var(--text-sec); font-weight: bold; }
        .day-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; background: var(--card-bg); color: var(--text-sec); }
        
        .timer { font-size: 4.5rem; font-weight: bold; color: var(--success); margin: 15px 0; font-family: monospace;}
        .reps-display { font-size: 3.5rem; font-weight: bold; color: var(--primary); margin: 15px 0; }
        .instruction { font-size: 1.1rem; line-height: 1.6; padding: 12px; background: var(--bg-color); border-radius: 10px; border: 1px solid var(--border); text-align: justify; }
        body.dark-mode .instruction { background: #121212; border-color: #333; }
        
        .badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 6px 15px; border-radius: 15px; font-size: 1rem; font-weight: bold; margin-bottom: 5px; }
        body.dark-mode .badge { background: #1b365d; color: #61b0ff; }
        
        .en-subtitle { font-size: 0.95rem; color: var(--text-sec); margin-bottom: 10px; direction: ltr; font-weight: bold; }

        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 1rem; font-weight: bold; }
        .settings-row input[type="number"] { width: 55px; padding: 6px; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-color); color: var(--text-main); font-size: 1rem; }
        .settings-row input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }

        .workout-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--card-bg); border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
        .workout-top-bar span { font-weight: bold; font-size: 1.1rem; color: var(--primary); }
    </style>

    <script>
        // --- Error Catcher ---
        window.onerror = function(message, source, lineno, colno, error) {
            alert("خطا در اجرا:\n" + message + "\nخط: " + lineno);
            return true; 
        };

        // --- Utilities & Preferences ---
        function safeGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
        function safeSet(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

        window.onload = function() {
            try {
                if(safeGet('dark') === '1') {
                    document.body.classList.add('dark-mode');
                    var chk = document.getElementById('chk-dark');
                    if(chk) chk.checked = true;
                }
                if(safeGet('sound') === '0') {
                    var sChk = document.getElementById('chk-sound');
                    if(sChk) sChk.checked = false;
                }
                updateCalendarUI();
            } catch(e) { console.error("Error in onload:", e); }
        };

        function toggleDark() {
            var chk = document.getElementById('chk-dark');
            if(chk && chk.checked) { document.body.classList.add('dark-mode'); safeSet('dark', '1'); } 
            else { document.body.classList.remove('dark-mode'); safeSet('dark', '0'); }
        }
        
        function toggleSound() {
            var sChk = document.getElementById('chk-sound');
            if(sChk && sChk.checked) safeSet('sound', '1'); else safeSet('sound', '0');
        }

        // --- Audio System ---
        var audioCtx = null;
        function playBeep(freq, duration, vol) {
            if(safeGet('sound') === '0') return;
            try {
                if (!audioCtx) {
                    var AudioContext = window.AudioContext || window.webkitAudioContext;
                    if(AudioContext) audioCtx = new AudioContext();
                }
                if(audioCtx && audioCtx.state !== 'closed') {
                    var osc = audioCtx.createOscillator(); 
                    var gainNode = audioCtx.createGain();
                    osc.type = "sine"; 
                    osc.frequency.setValueAtTime(freq || 600, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
                    osc.connect(gainNode); 
                    gainNode.connect(audioCtx.destination);
                    osc.start(); 
                    osc.stop(audioCtx.currentTime + (duration || 0.2));
                }
            } catch(e) {}
        }
        function playTick() { playBeep(900, 0.05, 0.01); }

        // --- Calendar System ---
        var dayIcons = { spine: '🧘‍♂️', legs: '🦵', cardio: '🔥', walk: '⛰️' };
        var dayNamesList = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

        function updateCalendarUI() {
            try {
                for(var i=0; i<=6; i++) {
                    var data = safeGet('day_' + i);
                    var el = document.getElementById('day-' + i);
                    if(el) {
                        if(data) {
                            var arr = data.split(',');
                            var lastType = "";
                            for(var j=0; j<arr.length; j++) { if(arr[j]) lastType = arr[j]; }
                            el.innerText = dayIcons[lastType] || '✔️';
                            el.style.borderColor = 'var(--success)'; el.style.color = 'var(--success)';
                        } else {
                            el.innerText = dayNamesList[i];
                            el.style.borderColor = 'var(--border)'; el.style.color = 'var(--text-sec)';
                            el.style.background = 'var(--card-bg)';
                        }
                    }
                }
            } catch(e) {}
        }

        function markTodayDone(type) {
            try {
                var dayIdx = new Date().getDay();
                var targetDay = (dayIdx === 6) ? 0 : dayIdx + 1;
                safeSet('day_' + targetDay, type);
                updateCalendarUI();
            } catch(e) {}
        }

        // --- Routine Data Base ---
        var routines = {
            spine: {
                isCircuit: false,
                exercises: [
                    { title: "چرخش لگن روی زمین", en: "Pelvic Tilt", desc: "خوابیده به پشت، زانوها خم، چسباندن گودی کمر به زمین.", type: "reps", val: "۱۲", sets: 3, bilateral: false },
                    { title: "گربه-گاو آرام", en: "Slow Cat-Cow", desc: "چهار دست و پا. تمرکز فقط روی حرکت مهره‌های میانی و بالایی پشت.", type: "reps", val: "۱۵", sets: 3, bilateral: false },
                    { title: "کتاب باز", en: "Open Book", desc: "خوابیده به پهلو، باز کردن دست بالایی به سمت عقب با چرخش سینه.", type: "reps", val: "۱۰", sets: 2, bilateral: true },
                    { title: "کرانچ اصلاح شده مک‌گیل", en: "McGill Modified Curl-up", desc: "یک پا خم، دست زیر کمر، بالا آوردن سر و شانه ۵ سانت (مکث ۵ ثانیه در بالا).", type: "reps", val: "۱۵", sets: 3, bilateral: false },
                    { title: "پلانک جانبی", en: "Side Plank", desc: "روی آرنج و لبه پا، بدن کاملاً در یک خط صاف.", type: "time", time: 30, sets: 3, bilateral: true },
                    { title: "سگ پرنده", en: "Bird Dog", desc: "چهار دست و پا، دست و پای مخالف کاملاً صاف و در امتداد بدن (بدون قوس کمر، مکث ۳ ثانیه).", type: "reps", val: "۱۰", sets: 3, bilateral: true },
                    { title: "پل باسن آرام", en: "Slow Glute Bridge", desc: "بالا آوردن باسن بدون قوس دادن به کمر (مکث ۲ ثانیه در بالا).", type: "reps", val: "۱۰", sets: 3, bilateral: false },
                    { title: "بالا آوردن پا از پهلو (قیچی)", en: "Side-Lying Hip Abduction", desc: "خوابیده به پهلو، بالا آوردن پای رویی با کنترل کامل.", type: "reps", val: "۳۰", sets: 3, bilateral: true },
                    { title: "کشش همسترینگ با کش", en: "Hamstring Stretch with Band", desc: "خوابیده، یک پا صاف روی زمین، پای دیگر عمود با کمک کش.", type: "time", time: 30, sets: 3, bilateral: true },
                    { title: "چرخش دمبل دور سر", en: "Dumbbell Halo", desc: "با دمبل ۱.۵ کیلویی، شکم کاملا منقبض (۱۵ دور چپ، ۱۵ دور راست).", type: "reps", val: "۳۰", sets: 3, bilateral: false },
                    { title: "پرس سینه روی زمین با دمبل", en: "Floor Press", desc: "خوابیده به پشت، پایین آوردن دمبل‌ها تا برخورد آرنج به زمین (فاز منفی ۳ ثانیه).", type: "reps", val: "۱۲", sets: 3, bilateral: false },
                    { title: "پشت بازو خوابیده روی زمین", en: "Lying Triceps Extension", desc: "خوابیده به پشت، حرکت دادن دمبل سبک از کنار گوش به سمت بالا.", type: "reps", val: "۲۰", sets: 3, bilateral: false },
                    { title: "عقب کشیدن چانه", en: "Chin Tuck", desc: "بدون بالا بردن سر، چانه را مستقیماً به سمت عقب (غبغب) بکشید (مکث ۳ ثانیه).", type: "reps", val: "۱۵", sets: 3, bilateral: false },
                    { title: "کشش دست‌ها با کش", en: "Band Pull-Apart", desc: "ایستاده، کش روبروی سینه، با آرنج صاف باز کنید تا به سینه برسد.", type: "reps", val: "۱۵", sets: 3, bilateral: false },
                    { title: "آویزان شدن از بارفیکس", en: "Dead Hang", desc: "آویزان شدن کاملاً بی‌حرکت جهت باز شدن فواصل مهره‌ها (بدون پرش).", type: "time", time: 60, sets: 4, bilateral: false }
                ]
            },
            legs: {
                isCircuit: false,
                exercises: [
                    { title: "اسکات روی صندلی", en: "Box Squat", desc: "با شکم منقبض، به آرامی روی صندلی بنشینید و با فشار پاشنه‌ها بلند شوید.", type: "reps", val: "۱۵", sets: 3, bilateral: false },
                    { title: "لانژ رو به جلو", en: "Forward Lunge", desc: "یک قدم به جلو، زانوی عقب به زمین نزدیک شود (زانوی جلو از پنجه رد نشود).", type: "reps", val: "۱۰", sets: 3, bilateral: true },
                    { title: "ساق پا ایستاده روی آجر", en: "Calf Raise on Block", desc: "پنجه‌ها روی آجر، پاشنه آزاد در هوا. پاشنه‌ها را بالا بکشید (مکث ۲ ثانیه).", type: "reps", val: "۲۰", sets: 3, bilateral: false }
                ]
            },
            cardio: {
                isCircuit: true,
                sets: 4, 
                exercises: [
                    { title: "درجا زدن ایستاده با دست", en: "Standing March with Arm Swings", desc: "سینه صاف، زانوها ۹۰ درجه بالا، تاب دادن هماهنگ دست‌ها.", type: "time", time: 40, bilateral: false },
                    { title: "پروانه بدون پرش", en: "Step-Jacks", desc: "پای راست به راست و دست‌ها بالای سر، سپس بازگشت و پای چپ.", type: "time", time: 40, bilateral: false },
                    { title: "سایه زنی", en: "Shadow Boxing / Straight Punches", desc: "ایستاده، شکم منقبض، به نوبت با دست راست و چپ رو به جلو مشت بزنید.", type: "time", time: 40, bilateral: false },
                    { title: "لگد به عقب ایستاده", en: "Standing Glute Kickbacks", desc: "یک پا را صاف به عقب هل دهید تا باسن منقبض شود (کمر قوس برندارد).", type: "time", time: 40, bilateral: false }
                ]
            }
        };

        // --- State Management ---
        var currentWorkoutType = '';
        var exIndex = 0; 
        var currentSet = 1; 
        var currentSide = 'none'; 
        var phase = 'prep'; 
        var stepTimer = null; 
        var timeLeft = 0;
        
        var globalSeconds = 0;
        var globalTimerInterval = null;

        function openSettings() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('settings-screen').classList.remove('hidden');
        }
        function closeSettings() {
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }
        function openWalkModal() { document.getElementById('modal-walk').classList.remove('hidden'); }
        function closeWalkModal() { document.getElementById('modal-walk').classList.add('hidden'); }

        function recordActivity(title, icon, type) {
            closeWalkModal();
            var btn = document.getElementById('btn-walk-menu');
            if(btn) btn.innerHTML = '<span>' + icon + '</span> ۴. ' + title + ' (ثبت شد ✔️)';
            markTodayDone(type);
        }

        function startWorkout(type) {
            try {
                playBeep(400, 0.1, 0.01); 
                currentWorkoutType = type;
                exIndex = 0; 
                currentSet = 1; 
                
                var routine = routines[type];
                currentSide = routine.exercises[0].bilateral ? 'left' : 'none';
                
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('workout-screen').classList.remove('hidden');
                
                globalSeconds = 0;
                if(globalTimerInterval) clearInterval(globalTimerInterval);
                document.getElementById('global-timer').innerText = "00:00";
                
                globalTimerInterval = setInterval(function() {
                    globalSeconds++;
                    var m = Math.floor(globalSeconds / 60).toString();
                    if(m.length < 2) m = '0' + m;
                    var s = (globalSeconds % 60).toString();
                    if(s.length < 2) s = '0' + s;
                    document.getElementById('global-timer').innerText = m + ":" + s;
                }, 1000);

                var prepInp = document.getElementById('inp-prep');
                var prepVal = prepInp ? parseInt(prepInp.value) : 5;
                if(isNaN(prepVal)) prepVal = 5;
                
                startPhase('prep', prepVal);
            } catch(e) {
                alert("خطا در شروع تمرین: " + e.message);
            }
        }

        function goHome() {
            if(stepTimer) clearInterval(stepTimer);
            if(globalTimerInterval) clearInterval(globalTimerInterval);
            document.getElementById('workout-screen').classList.add('hidden');
            document.getElementById('settings-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            updateCalendarUI();
        }

        function updateExUI() {
            var routine = routines[currentWorkoutType];
            if(exIndex >= routine.exercises.length) return;
            var ex = routine.exercises[exIndex];

            document.getElementById('ex-title').innerText = ex.title;
            document.getElementById('ex-en').innerText = ex.en;
            document.getElementById('ex-desc').innerText = ex.desc;
            
            var totalSets = routine.isCircuit ? routine.sets : ex.sets;
            var setLabel = routine.isCircuit ? "راند" : "ست";
            document.getElementById('badge-info').innerText = setLabel + " " + currentSet + " از " + totalSets;

            var sideBadge = document.getElementById('badge-side');
            if (ex.bilateral && currentSide !== 'none') {
                sideBadge.classList.remove('hidden');
                sideBadge.innerText = currentSide === 'left' ? "سمت چپ ⬅️" : "سمت راست ➡️";
            } else {
                sideBadge.classList.add('hidden');
            }
        }

        function startPhase(newPhase, time) {
            if(stepTimer) clearInterval(stepTimer);
            phase = newPhase;
            timeLeft = time;
            updateExUI(); 

            var phaseTitle = document.getElementById('phase-title');
            var display = document.getElementById('timer-display');
            var btnDone = document.getElementById('btn-done');

            if (phase === 'prep') {
                phaseTitle.innerText = "آماده‌سازی برای این حرکت...";
                display.className = "timer";
                display.style.color = "var(--warning)";
                display.innerText = timeLeft;
                btnDone.classList.add('hidden');
                runClock();
                playBeep(500, 0.1, 0.05);
            } 
            else if (phase === 'work') {
                var ex = routines[currentWorkoutType].exercises[exIndex];
                phaseTitle.innerText = "🔥 در حال اجرا";
                
                if (ex.type === 'reps') {
                    display.className = "reps-display";
                    display.innerText = ex.val + " تکرار";
                    btnDone.classList.remove('hidden');
                } else {
                    display.className = "timer";
                    display.style.color = "var(--success)";
                    display.innerText = timeLeft;
                    btnDone.classList.add('hidden');
                    runClock();
                }
                playBeep(800, 0.3, 0.05);
            } 
            else if (phase === 'rest') {
                phaseTitle.innerText = "استراحت ☕";
                display.className = "timer";
                display.style.col
