<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار تمرین ساسان</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #2c3e50; --text-sec: #7f8c8d;
            --primary: #2980b9; --primary-light: #d6eaf8; --success: #27ae60;
            --warning: #f39c12; --danger: #e74c3c; --purple: #8e44ad; --border: #ecf0f1;
        }
        body.dark-mode {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ecf0f1;
            --text-sec: #bdc3c7; --primary: #3498db; --primary-light: #2c3e50; --border: #333;
        }
        body { font-family: Tahoma, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; text-align: center; }
        .hidden { display: none !important; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid var(--border); }
        h2 { color: var(--primary); font-size: 1.3rem; margin: 10px 0; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); font-size: 1.2rem; padding: 8px 12px; border-radius: 10px; cursor: pointer; color: var(--text-main); }

        button { background: var(--primary); color: white; border: none; padding: 16px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; width: 100%; margin-bottom: 12px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 10px; }
        button.legs { background: #f39c12; }
        button.cardio { background: #e74c3c; }
        button.walk { background: var(--card-bg); color: var(--success); border: 2px solid var(--success); }
        button.alt { background: var(--text-sec); padding: 12px; margin-top: 15px; }
        button.outline { background: transparent; color: var(--text-sec); border: 2px solid var(--border); box-shadow: none; }
        
        /* تقویم هفتگی */
        .week-grid { display: flex; justify-content: space-between; gap: 5px; margin-top: 10px; }
        .day-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
        .day-name { font-size: 0.75rem; color: var(--text-sec); font-weight: bold; }
        .day-circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; background: var(--bg-color); color: var(--text-sec); }
        .day-circle.done { background: var(--success); border-color: var(--success); color: white; }

        .timer { font-size: 3.5rem; font-weight: bold; color: var(--success); margin: 15px 0; font-family: monospace;}
        .instruction { font-size: 1rem; line-height: 1.6; padding: 12px; background: var(--bg-color); border-radius: 10px; border: 1px solid var(--border); text-align: right; }
        
        .badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 5px 12px; border-radius: 15px; font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; }
        
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; font-weight: bold; }
        .settings-row input[type="number"] { width: 50px; padding: 5px; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-color); color: var(--text-main); font-size: 1rem; }
    </style>
</head>
<body>

<!-- صفحه اصلی -->
<div id="home-screen">
    <div class="header-bar">
        <button class="icon-btn" onclick="openSettings()">⚙️ تنظیمات</button>
        <h2>دستیار تمرین ساسان</h2>
        <div style="width: 70px;"></div>
    </div>

    <!-- تقویم هفتگی -->
    <div class="card">
        <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 5px;">📊 وضعیت تمرینات این هفته</div>
        <div class="week-grid">
            <div class="day-col"><span class="day-name">ش</span><div class="day-circle" id="day-0">ش</div></div>
            <div class="day-col"><span class="day-name">ی</span><div class="day-circle" id="day-1">ی</div></div>
            <div class="day-col"><span class="day-name">د</span><div class="day-circle" id="day-2">د</div></div>
            <div class="day-col"><span class="day-name">س</span><div class="day-circle" id="day-3">س</div></div>
            <div class="day-col"><span class="day-name">چ</span><div class="day-circle" id="day-4">چ</div></div>
            <div class="day-col"><span class="day-name">پ</span><div class="day-circle" id="day-5">پ</div></div>
            <div class="day-col"><span class="day-name">ج</span><div class="day-circle" id="day-6">ج</div></div>
        </div>
    </div>

    <div class="card">
        <button onclick="startWorkout('spine')"><span>🧘‍♂️</span> ۱. روتین کمر و عضله‌سازی</button>
        <button class="legs" onclick="startWorkout('legs')"><span>🦵</span> ۲. تمرینات پا (۳ روز در هفته)</button>
        <button class="cardio" onclick="startWorkout('cardio')"><span>🔥</span> ۳. تمرین کاردیو (چربی‌سوز)</button>
        <button class="walk" id="btn-walk-menu" onclick="openWalkModal()"><span>🚶‍♂️</span> ۴. ثبت پیاده‌روی / کوه صفه</button>
    </div>
</div>

<!-- مودال پیاده‌روی -->
<div id="modal-walk" class="card hidden" style="position: fixed; top: 20%; left: 5%; right: 5%; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    <h3>انتخاب فعالیت امروز 🎯</h3>
    <button style="background: var(--success);" onclick="recordActivity('تکمیل ۵۰۰۰ قدم', '🚶‍♂️')"><span>🚶‍♂️</span> ۵۰۰۰ قدم پیاده‌روی</button>
    <button style="background: var(--purple);" onclick="recordActivity('کوه صفه', '⛰️')"><span>⛰️</span> هایکینگ کوه صفه</button>
    <button class="outline" onclick="closeWalkModal()">انصراف</button>
</div>

<!-- صفحه تنظیمات -->
<div id="settings-screen" class="hidden">
    <h2>تنظیمات برنامه</h2>
    <div class="card">
        <div class="settings-row">
            <span>حالت شب (تاریک) 🌙</span>
            <input type="checkbox" id="chk-dark" onchange="toggleDark()" style="width: 20px; height: 20px;">
        </div>
        <div class="settings-row">
            <span>زمان آماده‌سازی (ثانیه) ⏱️</span>
            <input type="number" id="inp-prep" value="5">
        </div>
        <div class="settings-row">
            <span>زمان استراحت (ثانیه) ☕</span>
            <input type="number" id="inp-rest" value="20">
        </div>
    </div>
    <button onclick="closeSettings()">ذخیره و بازگشت 🏠</button>
</div>

<!-- صفحه تمرین -->
<div id="workout-screen" class="hidden">
    <div class="badge" id="badge-info">ست ۱ از ۳</div>
    <div class="badge hidden" id="badge-side" style="background:#fff3cd; color:#856404;">سمت چپ ⬅️</div>
    
    <h3 id="ex-title" style="color: var(--primary); font-size: 1.3rem; margin: 5px 0;">نام تمرین</h3>
    <div id="ex-desc" class="instruction">توضیحات تمرین...</div>
    
    <div class="card" style="margin-top: 15px;">
        <h4 id="phase-title" style="font-size: 1.1rem; color: var(--text-sec); margin: 5px 0;">آماده‌سازی</h4>
        <div id="timer-display" class="timer">5</div>
        <button id="btn-done" class="hidden" onclick="nextStep()" style="background: var(--success);">انجام شد ✔️</button>
        <button id="btn-skip" class="outline" onclick="nextStep()">رد کردن مرحله ⏭️</button>
    </div>
    
    <button class="alt" onclick="goHome()">توقف و بازگشت به منو 🏠</button>
</div>

<script>
    // توابع ایمن برای حافظه (جلوگیری از کرش با سایفون/مرورگر)
    function safeGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
    function safeSet(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

    // بارگذاری تنظیمات اولیه
    window.onload = function() {
        if(safeGet('dark') === '1') {
            document.body.classList.add('dark-mode');
            let chk = document.getElementById('chk-dark');
            if(chk) chk.checked = true;
        }
        updateCalendarUI();
    };

    function toggleDark() {
        let isDark = document.getElementById('chk-dark').checked;
        if(isDark) {
            document.body.classList.add('dark-mode');
            safeSet('dark', '1');
        } else {
            document.body.classList.remove('dark-mode');
            safeSet('dark', '0');
        }
    }

    function updateCalendarUI() {
        for(let i=0; i<=6; i++) {
            if(safeGet('day_' + i) === 'done') {
                let el = document.getElementById('day-' + i);
                if(el) {
                    el.classList.add('done');
                    el.innerText = '✔️';
                }
            }
        }
    }

    function markTodayDone() {
        let dayIdx = new Date().getDay();
        let targetDay = (dayIdx === 6) ? 0 : dayIdx + 1; // تنظیم شنبه تا جمعه
        safeSet('day_' + targetDay, 'done');
        updateCalendarUI();
    }

    // داده‌های کامل تمرینات (با پشتیبانی چپ و راست)
    const routines = {
        spine: [
            { title: "چرخش لگن روی زمین", desc: "خوابیده به پشت، زانوها خم، چسباندن گودی کمر به زمین. (۱۲ تکرار)", type: "reps", sets: 3 },
            { title: "گربه-گاو آرام", desc: "چهار دست و پا. تمرکز روی مهره‌های کمر. (۱۵ تکرار)", type: "reps", sets: 3 },
            { title: "پلانک جانبی", desc: "بدن در یک خط صاف روی آرنج.", type: "time", time: 30, sets: 3, bilateral: true }
        ],
        legs: [
            { title: "اسکات روی صندلی", desc: "نشستن کنترل‌شده روی لبه صندلی. (۱۵ تکرار)", type: "reps", sets: 3 },
            { title: "لانژ رو به جلو", desc: "زانوی عقب نزدیک زمین. (۱۰ تکرار)", type: "reps", sets: 3, bilateral: true }
        ],
        cardio: [
            { title: "درجا زدن ایستاده", desc: "سینه صاف، زانوها بالا.", type: "time", time: 40, sets: 1, customBadge: "راند کاردیو" },
            { title: "پروانه بدون پرش", desc: "سرعت بالا بدون پرش.", type: "time", time: 40, sets: 1, customBadge: "راند کاردیو" }
        ]
    };

    let activeRoutine = [];
    let exIndex = 0;
    let currentSet = 1;
    let currentSide = 'left';
    let phase = 'prep';
    let timer = null;
    let timeLeft = 5;

    function openSettings() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('settings-screen').classList.remove('hidden');
    }
    function closeSettings() {
        document.getElementById('settings-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
    }
    function openWalkModal() { document.getElementById('modal-walk').classList.remove('hidden'); }
    function closeWalkModal() { document.getElementById('modal-walk').classList.add('hidden'); }

    function recordActivity(title, icon) {
        closeWalkModal();
        let btn = document.getElementById('btn-walk-menu');
        if(btn) btn.innerHTML = `<span>${icon}</span> ۴. ${title} (ثبت شد ✔️)`;
        markTodayDone();
    }

    function startWorkout(type) {
        activeRoutine = routines[type];
        exIndex = 0;
        currentSet = 1;
        currentSide = 'left';
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('workout-screen').classList.remove('hidden');
        loadEx();
    }

    function goHome() {
        clearInterval(timer);
        document.getElementById('workout-screen').classList.add('hidden');
        document.getElementById('settings-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        updateCalendarUI();
    }

    function loadEx() {
        if (exIndex >= activeRoutine.length) {
            markTodayDone();
            alert("🏆 عالی بود! تمرین امروز با موفقیت ثبت شد.");
            goHome();
            return;
        }
        let ex = activeRoutine[exIndex];
        document.getElementById('ex-title').innerText = ex.title;
        document.getElementById('ex-desc').innerText = ex.desc;
        
        let badgeInfo = document.getElementById('badge-info');
        badgeInfo.innerText = ex.customBadge ? ex.customBadge : `ست ${currentSet} از ${ex.sets}`;

        let sideBadge = document.getElementById('badge-side');
        if (ex.bilateral) {
            sideBadge.classList.remove('hidden');
            sideBadge.innerText = currentSide === 'left' ? "سمت چپ ⬅️" : "سمت راست ➡️";
        } else {
            sideBadge.classList.add('hidden');
        }

        let prepVal = parseInt(document.getElementById('inp-prep').value) || 5;
        startPhase('prep', prepVal);
    }

    function startPhase(newPhase, time) {
        clearInterval(timer);
        phase = newPhase;
        timeLeft = time;

        let phaseTitle = document.getElementById('phase-title');
        let display = document.getElementById('timer-display');
        let btnDone = document.getElementById('btn-done');
        let btnSkip = document.getElementById('btn-skip');

        display.innerText = timeLeft;

        if (phase === 'prep') {
            phaseTitle.innerText = "آماده‌سازی...";
            display.style.color = "var(--warning)";
            btnDone.classList.add('hidden');
            btnSkip.classList.remove('hidden');
            runClock();
        } else if (phase === 'work') {
            phaseTitle.innerText = "🔥 در حال اجرا";
            display.style.color = "var(--success)";
            let ex = activeRoutine[exIndex];
            if (ex.type === 'reps') {
                display.innerText = "انجام تکرارها";
                btnDone.classList.remove('hidden');
                btnSkip.classList.add('hidden');
            } else {
                btnDone.classList.add('hidden');
                btnSkip.classList.add('hidden');
                runClock();
            }
        } else if (phase === 'rest') {
            phaseTitle.innerText = "استراحت ☕";
            display.style.color = "var(--danger)";
            btnDone.classList.add('hidden');
            btnSkip.classList.remove('hidden');
            runClock();
        }
    }

    function runClock() {
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                nextStep();
            }
        }, 1000);
    }

    function nextStep() {
        clearInterval(timer);
        if (phase === 'prep') {
            let ex = activeRoutine[exIndex];
            startPhase('work', ex.time || 0);
        } else if (phase === 'work') {
            let restVal = parseInt(document.getElementById('inp-rest').value) || 20;
            startPhase('rest', restVal);
        } else if (phase === 'rest') {
            let ex = activeRoutine[exIndex];
            if (ex.bilateral && currentSide === 'left') {
                currentSide = 'right';
                let prepVal = parseInt(document.getElementById('inp-prep').value) || 5;
                startPhase('prep', prepVal);
            } else {
                if (ex.bilateral) currentSide = 'left';
                if (currentSet < ex.sets) {
                    currentSet++;
                    let prepVal = parseInt(document.getElementById('inp-prep').value) || 5;
                    startPhase('prep', prepVal);
                } else {
                    currentSet = 1;
                    exIndex++;
                    loadEx();
                }
            }
        }
    }
</script>
</body>
</html>
