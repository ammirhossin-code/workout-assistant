<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار تمرین ساسان</title>
    <style>
        :root {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #2c3e50; --text-sec: #7f8c8d;
            --primary: #2980b9; --primary-light: #d6eaf8; --success: #27ae60;
            --warning: #f39c12; --danger: #e74c3c; --border: #ecf0f1;
        }
        body.dark-mode {
            --bg-color: #121212; --card-bg: #1a1a1a; --text-main: #e0e0e0;
            --text-sec: #95a5a6; --primary: #3498db; --primary-light: #212f3d; --border: #2c2c2c;
        }
        body { font-family: Tahoma, Arial, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; text-align: center; transition: background 0.3s, color 0.3s; }
        .hidden { display: none !important; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid var(--border); }
        h2 { color: var(--primary); font-size: 1.4rem; margin: 10px 0; font-weight: bold; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); font-size: 1.1rem; padding: 8px 12px; border-radius: 10px; cursor: pointer; color: var(--text-main); }

        button { background: var(--primary); color: white; border: none; padding: 16px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; width: 100%; margin-bottom: 12px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        body.dark-mode button { background: #22303c; color: #ecf0f1; border: 1px solid #324454; }
        body.dark-mode button.legs { background: #3d2d14; border-color: #5c431d; color: #f39c12; }
        body.dark-mode button.cardio { background: #3d1a1a; border-color: #5c2626; color: #e74c3c; }
        body.dark-mode button.walk { background: #143d22; border-color: #1e5c33; color: #2ecc71; }
        
        button.legs { background: #f39c12; }
        button.cardio { background: #e74c3c; }
        button.walk { background: var(--card-bg); color: var(--success); border: 2px solid var(--success); }
        button.alt { background: var(--text-sec); padding: 12px; margin-top: 15px; }
        button.outline { background: transparent; color: var(--text-sec); border: 2px solid var(--border); box-shadow: none; }
        body.dark-mode button.outline { color: #a0a0a0; border-color: #444; }

        /* تقویم هفتگی تک‌ردیفه استاندارد و پایدار */
        .week-grid { display: flex; justify-content: space-between; gap: 5px; margin-top: 10px; }
        .day-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
        .day-name { font-size: 0.8rem; color: var(--text-sec); font-weight: bold; }
        .day-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; background: var(--card-bg); color: var(--text-sec); }
        
        .timer { font-size: 4.5rem; font-weight: bold; color: var(--success); margin: 15px 0; font-family: monospace;}
        .reps-display { font-size: 4rem; font-weight: bold; color: var(--primary); margin: 15px 0; }
        .instruction { font-size: 1.1rem; line-height: 1.6; padding: 12px; background: var(--bg-color); border-radius: 10px; border: 1px solid var(--border); text-align: justify; }
        body.dark-mode .instruction { background: #121212; border-color: #333; }
        
        .badge { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 6px 15px; border-radius: 15px; font-size: 1rem; font-weight: bold; margin-bottom: 5px; }
        body.dark-mode .badge { background: #1b365d; color: #61b0ff; }
        
        .en-subtitle { font-size: 0.95rem; color: var(--text-sec); margin-bottom: 10px; direction: ltr; font-weight: bold; }

        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 1rem; font-weight: bold; }
        .settings-row input[type="number"] { width: 55px; padding: 6px; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-color); color: var(--text-main); font-size: 1rem; }
        .settings-row input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
    </style>
</head>
<body>

<!-- صفحه اصلی -->
<div id="home-screen">
    <div class="header-bar">
        <button class="icon-btn" onclick="openSettings()">⚙️ تنظیمات</button>
        <h2>دستیار تمرین ساسان</h2>
        <div style="width: 60px;"></div>
    </div>

    <!-- تقویم هفتگی استاندارد -->
    <div class="card">
        <div style="font-size: 0.95rem; font-weight: bold; margin-bottom: 5px;">📊 وضعیت تمرینات این هفته</div>
        <div class="week-grid">
            <div class="day-col"><span class="day-name">ش</span><div class="day-circle" id="day-0">ش</div></div>
            <div class="day-col"><span class="day-name">ی</span><div class="day-circle" id="day-1">ی</div></div>
            <div class="day-col"><span class="day-name">د</span><div class="day-circle" id="day-2">د</div></div>
            <div class="day-col"><span class="day-name">س</span><div class="day-circle" id="day-3">س</div></div>
            <div class="day-col"><span class="day-name">چ</span><div class="day-circle" id="day-4">چ</div></div>
            <div class="day-col"><span class="day-name">پ</span><div class="day-circle" id="day-5">پ</div></div>
            <div class="day-col"><span class="day-name">ج</span><div class="day-circle" id="day-6">ج</div></div>
        </div>
    </div>

    <div class="card">
        <button onclick="startWorkout('spine')"><span>🧘‍♂️</span> ۱. روتین کمر و عضله‌سازی</button>
        <button class="legs" onclick="startWorkout('legs')"><span>🦵</span> ۲. تمرینات پا (۳ روز در هفته)</button>
        <button class="cardio" onclick="startWorkout('cardio')"><span>🔥</span> ۳. تمرین کاردیو (چربی‌سوز)</button>
        <button class="walk" id="btn-walk-menu" onclick="openWalkModal()"><span>🚶‍♂️</span> ۴. ثبت پیاده‌روی / کوه</button>
    </div>
</div>

<!-- مودال پیاده‌روی -->
<div id="modal-walk" class="card hidden" style="position: fixed; top: 20%; left: 5%; right: 5%; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    <h3 style="font-size: 1.3rem;">انتخاب فعالیت امروز 🎯</h3>
    <button style="background: var(--success); color: white;" onclick="recordActivity('تکمیل ۵۰۰۰ قدم', '🚶‍♂️', 'walk')"><span>🚶‍♂️</span> ۵۰۰۰ قدم پیاده‌روی</button>
    <button style="background: var(--success); color: white;" onclick="recordActivity('کوه صفه', '⛰️', 'walk')"><span>⛰️</span> هایکینگ کوه صفه</button>
    <button class="outline" onclick="closeWalkModal()">انصراف</button>
</div>

<!-- تنظیمات -->
<div id="settings-screen" class="hidden">
    <h2 style="font-size: 1.5rem;">تنظیمات برنامه</h2>
    <div class="card">
        <div class="settings-row">
            <span>حالت شب (تاریک ملایم) 🌙</span>
            <input type="checkbox" id="chk-dark" onchange="toggleDark()">
        </div>
        <div class="settings-row">
            <span>فعال بودن صدا 🔊</span>
            <input type="checkbox" id="chk-sound" checked onchange="toggleSound()">
        </div>
        <div class="settings-row">
            <span>زمان آماده‌سازی (ثانیه) ⏱️</span>
            <input type="number" id="inp-prep" value="5">
        </div>
        <div class="settings-row">
            <span>زمان استراحت (ثانیه) ☕</span>
            <input type="number" id="inp-rest" value="20">
        </div>
    </div>
    <button onclick="closeSettings()">ذخیره و بازگشت 🏠</button>
</div>

<!-- صفحه تمرین -->
<div id="workout-screen" class="hidden">
    <div class="badge" id="badge-info">ست ۱ از ۳</div>
    <div class="badge hidden" id="badge-side" style="background:#fff3cd; color:#856404;">سمت چپ ⬅️</div>
    
    <h3 id="ex-title" style="color: var(--primary); font-size: 1.5rem; margin: 5px 0;">نام تمرین</h3>
    <div id="ex-en" class="en-subtitle">Exercise Name</div>
    <div id="ex-desc" class="instruction">توضیحات تمرین...</div>
    
    <div class="card" style="margin-top: 15px;">
        <h4 id="phase-title" style="font-size: 1.3rem; color: var(--text-sec); margin: 5px 0;">آماده‌سازی</h4>
        <div id="timer-display" class="timer">5</div>
        
        <button id="btn-done" class="hidden" onclick="nextStep()" style="background: var(--success); color: white;">انجام شد ✔️</button>
        <button id="btn-skip" class="outline" onclick="nextStep()">رد کردن مرحله ⏭️</button>
    </div>
    
    <button class="alt" onclick="goHome()">توقف و بازگشت به منو 🏠</button>
</div>

<script>
    function safeGet(key) {
        try { return localStorage.getItem(key); } catch(e) { return null; }
    }
    function safeSet(key, val) {
        try { localStorage.setItem(key, val); } catch(e) {}
    }

    window.onload = function() {
        try {
            if(safeGet('dark') === '1') {
                document.body.classList.add('dark-mode');
                let chk = document.getElementById('chk-dark');
                if(chk) chk.checked = true;
            }
            if(safeGet('sound') === '0') {
                let sChk = document.getElementById('chk-sound');
                if(sChk) sChk.checked = false;
            }
            updateCalendarUI();
        } catch(e) {}
    };

    function toggleDark() {
        let chk = document.getElementById('chk-dark');
        if(chk && chk.checked) {
            document.body.classList.add('dark-mode');
            safeSet('dark', '1');
        } else {
            document.body.classList.remove('dark-mode');
            safeSet('dark', '0');
        }
    }
    
    function toggleSound() {
        let sChk = document.getElementById('chk-sound');
        if(sChk && sChk.checked) safeSet('sound', '1');
        else safeSet('sound', '0');
    }

    let audioCtx = null;
    function playBeep(freq = 600, duration = 0.2) {
        if(safeGet('sound') === '0') return;
        try {
            if (!audioCtx) {
                let AContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AContext();
            }
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const dayIcons = {
        spine: '🧘‍♂️',
        legs: '🦵',
        cardio: '🔥',
        walk: '⛰️'
    };

    const dayNamesList = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

    function updateCalendarUI() {
        try {
            for(let i=0; i<=6; i++) {
                let data = safeGet('day_' + i);
                let el = document.getElementById('day-' + i);
                if(el) {
                    if(data) {
                        let lastType = data.split(',').filter(x => x).pop();
                        el.innerText = dayIcons[lastType] || '✔️';
                        el.style.borderColor = 'var(--success)';
                        el.style.color = 'var(--success)';
                    } else {
                        el.innerText = dayNamesList[i];
                        el.style.borderColor = 'var(--border)';
                        el.style.color = 'var(--text-sec)';
                        el.style.background = 'var(--card-bg)';
                    }
                }
            }
        } catch(e) {}
    }

    function markTodayDone(type) {
        try {
            let dayIdx = new Date().getDay();
            let targetDay = (dayIdx === 6) ? 0 : dayIdx + 1;
            safeSet('day_' + targetDay, type);
            updateCalendarUI();
        } catch(e) {}
    }

    const routines = {
        spine: [
            { title: "چرخش لگن روی زمین", en: "Pelvic Tilt", desc: "خوابیده به پشت، زانوها خم، چسباندن گودی کمر به زمین.", type: "reps", val: "۱۲", sets: 3 },
            { title: "گربه-گاو آرام", en: "Slow Cat-Cow", desc: "چهار دست و پا. تمرکز روی مهره‌های کمر.", type: "reps", val: "۱۵", sets: 3 },
            { title: "پلانک جانبی", en: "Side Plank", desc: "بدن در یک خط صاف روی آرنج.", type: "time", time: 30, sets: 3, bilateral: true },
            { title: "آویزان شدن از بارفیکس", en: "Dead Hang", desc: "آویزان شدن ریلکس از بارفیکس برای کشش مهره‌ها.", type: "time", time: 30, sets: 3 }
        ],
        legs: [
            { title: "اسکات روی صندلی", en: "Box Squat", desc: "نشستن کنترل‌شده روی لبه صندلی.", type: "reps", val: "۱۵", sets: 3 },
            { title: "لانژ رو به جلو", en: "Forward Lunge", desc: "زانوی عقب نزدیک زمین.", type: "reps", val: "۱۰", sets: 3, bilateral: true }
        ],
        cardio: [
            { title: "درجا زدن ایستاده", en: "Standing March", desc: "سینه صاف، زانوها بالا.", type: "time", time: 40, sets: 1, customBadge: "راند کاردیو" },
            { title: "پروانه بدون پرش", en: "Step-Jacks", desc: "سرعت بالا بدون پرش.", type: "time", time: 40, sets: 1, customBadge: "راند کاردیو" }
        ]
    };

    let activeRoutine = [];
    let currentWorkoutType = '';
    let exIndex = 0; let currentSet = 1; let currentSide = 'left';
    let phase = 'prep'; let timer = null; let timeLeft = 5;

    function openSettings() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('settings-screen').classList.remove('hidden');
    }
    function closeSettings() {
        document.getElementById('settings-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
    }
    function openWalkModal() { document.getElementById('modal-walk').classList.remove('hidden'); }
    function closeWalkModal() { document.getElementById('modal-walk').classList.add('hidden'); }

    function recordActivity(title, icon, type) {
        closeWalkModal();
        let btn = document.getElementById('btn-walk-menu');
        if(btn) btn.innerHTML = `<span>${icon}</span> ۴. ${title} (ثبت شد ✔️)`;
        markTodayDone(type);
    }

    function startWorkout(type) {
        playBeep(0, 0.01); 
        currentWorkoutType = type;
        activeRoutine = routines[type];
        exIndex = 0; currentSet = 1; currentSide = 'left';
        
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('workout-screen').classList.remove('hidden');
        loadEx();
    }

    function goHome() {
        clearInterval(timer);
        document.getElementById('workout-screen').classList.add('hidden');
        document.getElementById('settings-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        updateCalendarUI();
    }

    function loadEx() {
        if (exIndex >= activeRoutine.length) {
            markTodayDone(currentWorkoutType);
            playBeep(1000, 0.5);
            setTimeout(() => { alert("🏆 عالی بود! تمرین امروز با موفقیت ثبت شد."); goHome(); }, 300);
            return;
        }
        let ex = activeRoutine[exIndex];
        document.getElementById('ex-title').innerText = ex.title;
        document.getElementById('ex-en').innerText = ex.en;
        document.getElementById('ex-desc').innerText = ex.desc;
        
        let badgeInfo = document.getElementById('badge-info');
        badgeInfo.innerText = ex.customBadge ? ex.customBadge : `ست ${currentSet} از ${ex.sets}`;

        let sideBadge = document.getElementById('badge-side');
        if (ex.bilateral) {
            sideBadge.classList.remove('hidden');
            sideBadge.innerText = currentSide === 'left' ? "سمت چپ ⬅️" : "سمت راست ➡️";
        } else {
            sideBadge.classList.add('hidden');
        }

        let prepInput = document.getElementById('inp-prep');
        let prepVal = prepInput ? (parseInt(prepInput.value) || 5) : 5;
        startPhase('prep', prepVal);
    }

    function startPhase(newPhase, time) {
        clearInterval(timer);
        phase = newPhase;
        timeLeft = time;

        let phaseTitle = document.getElementById('phase-title');
        let display = document.getElementById('timer-display');
        let btnDone = document.getElementById('btn-done');
        let btnSkip = document.getElementById('btn-skip');

        if (phase === 'prep') {
            if(phaseTitle) phaseTitle.innerText = "آماده‌سازی...";
            if(display) {
                display.className = "timer";
                display.style.color = "var(--warning)";
                display.innerText = timeLeft;
            }
            if(btnDone) btnDone.classList.add('hidden');
            if(btnSkip) btnSkip.classList.remove('hidden');
            runClock();
            playBeep(500, 0.1);
        } else if (phase === 'work') {
            if(phaseTitle) phaseTitle.innerText = "🔥 در حال اجرا";
            let ex = activeRoutine[exIndex];
            
            if (ex.type === 'reps') {
                if(display) {
                    display.className = "reps-display";
                    display.innerText = ex.val + " تکرار";
                }
                if(btnDone) btnDone.classList.remove('hidden');
                if(btnSkip) btnSkip.classList.add('hidden');
                playBeep(800, 0.3);
            } else {
                if(display) {
                    display.className = "timer";
                    display.style.color = "var(--success)";
                    display.innerText = timeLeft;
                }
                if(btnDone) btnDone.classList.add('hidden');
                if(btnSkip) btnSkip.classList.add('hidden');
                runClock();
                playBeep(800, 0.3);
            }
        } else if (phase === 'rest') {
            if(phaseTitle) phaseTitle.innerText = "استراحت ☕";
            if(display) {
                display.className = "timer";
                display.style.color = "var(--danger)";
                display.innerText = timeLeft;
            }
            if(btnDone) btnDone.classList.add('hidden');
            if(btnSkip) btnSkip.classList.remove('hidden');
            runClock();
            playBeep(400, 0.2);
        }
    }

    function runClock() {
        timer = setInterval(() => {
            timeLeft--;
            let display = document.getElementById('timer-display');
            if(display) display.innerText = timeLeft;
            
            if(timeLeft <= 3 && timeLeft > 0) playBeep(900, 0.1);
            if (timeLeft <= 0) {
                clearInterval(timer);
                nextStep();
            }
        }, 1000);
    }

    function nextStep() {
        clearInterval(timer);
        let ex = activeRoutine[exIndex];
        let prepInput = document.getElementById('inp-prep');
        let restInput = document.getElementById('inp-rest');
        let prepVal = prepInput ? (parseInt(prepInput.value) || 5) : 5;
        let restVal = restInput ? (parseInt(restInput.value) || 20) : 20;

        if (phase === 'prep') {
            startPhase('work', ex.time || 0);
        } else if (phase === 'work') {
            startPhase('rest', restVal);
        } else if (phase === 'rest') {
            if (ex.bilateral && currentSide === 'left') {
                currentSide = 'right';
                startPhase('prep', prepVal);
            } else {
                if (ex.bilateral) currentSide = 'left';
